<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inbox Agent</title>
  {# The CSS that Tailwind's program builds from the classes used in the templates #}
  <link rel="stylesheet" href="{{ url_for('static', path='app.css').path }}">
</head>
<body class="min-h-screen bg-blue-100 p-8">
  <main class="mx-auto max-w-xl rounded-lg bg-white p-8 shadow-sm">
    <h1 class="text-3xl font-bold text-gray-900">Inbox Agent</h1>
    {# made_at is a placeholder: Python fills it in on every request, so refreshing the page changes the time. #}
    <p class="mt-2 text-gray-600">The web page is running. This page was made at {{ made_at }}.</p>
  </main>
</body>
</html>
